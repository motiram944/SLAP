[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slap-backend"
version = "0.1.0"
description = "Semantic Latent-Algebraic Protocol (SLAP) Orchestration Gateway & Subsystems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "qdrant-client>=1.8.0",
    "protobuf>=4.25.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.5.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

