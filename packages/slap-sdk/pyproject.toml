[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slap-sdk"
version = "0.1.0"
description = "Python client for Semantic Latent-Algebraic Protocol (SLAP) — drop-in replacement for traditional RAG and Pinecone/Chroma"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "SLAP Protocol Team", email = "motiramshinde944@gmail.com" }
]
keywords = [
    "rag",
    "vector-database",
    "embeddings",
    "qdrant",
    "llm",
    "latent-space",
    "slap",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/motiram944/SLAP"
Repository = "https://github.com/motiram944/SLAP"
Documentation = "https://github.com/motiram944/SLAP#readme"
